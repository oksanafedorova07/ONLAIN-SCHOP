{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-8 bg-body-tertiary">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-1 g-3">
        <div class="col">
          <div class="card shadow-sm">
           <img src="{{ product.photo|media_filter }}">
            <div class="card-body">
              <p class="card-text"><strong>{{ object.name }}</strong></p>
              <p class="card-text">{{ object.description }}</p>
              <p class="card-text">{{ object.price }}</p>
              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                 <a class="btn btn-primary" href="{% url 'catalog:product_list' %}" role="button">Назад</a>
                 <a class="btn btn-primary" href="{% url 'catalog:product_confirm_delete' product.pk %}" role="button">Удалить</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
