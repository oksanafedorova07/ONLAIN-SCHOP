{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        {% for product in object_list %}
        <div class="col">
          <div class="card shadow-sm">
           <img src="{{ product.photo|media_filter }}">
            <div class="card-body">
              <p class="card-text"><strong>{{ product.name }}</strong></p>
              <p class="card-text">{{ product.description|slice:":100" }}</p>
              <p class="card-text">{{ product.price }}</p>
              <div class="d-flex justify-content-between align-items-center">
                  <div class="btn-group">
                     <a class="btn btn-primary" href="{% url 'catalog:product_detail' product.pk %}" role="button">Характеристики</a>
                     <a class="btn btn-primary" href="{% url 'catalog:product_update' product.pk %}" role="button">Изменить</a>
                     <a class="btn btn-primary" href="{% url 'catalog:product_confirm_delete' product.pk %}" role="button">Удалить</a>
                  </div>
              </div>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
{% endblock %}
